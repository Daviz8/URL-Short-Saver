version: "3"
services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Money123
      - POSTGRES_DB=short
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # useful if you want to connect with a GUI like pgAdmin

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - POSTGRES_URL=postgresql://postgres:Money123@postgres:5432/short
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  client:
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    depends_on:
      - api
      - client
    restart: always
    ports:
      - "3050:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres-data:
